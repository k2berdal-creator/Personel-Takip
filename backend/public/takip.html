<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saha Personel Takip - Mobil İstemci</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Saha Takip">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f3f4; padding: 16px; }
    .card { background: white; border-radius: 14px; padding: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 440px; margin: 0 auto 16px auto; }
    h1 { font-size: 20px; color: #202124; text-align: center; margin-bottom: 12px; }
    .status-badge { display: block; text-align: center; font-size: 13px; font-weight: bold; padding: 6px 12px; border-radius: 20px; margin-bottom: 14px; }
    .online { background: #e6f4ea; color: #137333; }
    .offline { background: #fce8e6; color: #c5221f; }
    label { font-size: 13px; font-weight: 600; color: #5f6368; display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
    button { width: 100%; padding: 13px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-success { background: #1e8e3e; color: white; }
    .btn-danger { background: #d93025; color: white; }
    .btn-sos { background: #d93025; color: white; font-size: 16px; padding: 16px; margin-top: 10px; box-shadow: 0 4px 12px rgba(217, 48, 37, 0.35); }
    .btn-sos:active { background: #a51d14; transform: scale(0.98); }
    .btn-outline { background: #f8f9fa; border: 1px solid #dadce0; color: #1a73e8; }
    .btn-outline:active { background: #e8f0fe; }
    .info-box { background: #f8f9fa; border-radius: 8px; padding: 12px; font-size: 13px; color: #3c4043; line-height: 1.6; }
    .mode-pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    .moving { background: #e8f0fe; color: #1a73e8; }
    .idle { background: #e6f4ea; color: #137333; }
    
    /* Telsiz & Hızlı Durum Butonları */
    .status-chips-title { font-size: 12px; font-weight: bold; color: #5f6368; margin-top: 10px; margin-bottom: 6px; }
    .status-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .chip-btn { background: #f1f3f4; border: 1px solid #dadce0; border-radius: 8px; padding: 10px 8px; font-size: 12px; font-weight: 600; color: #202124; cursor: pointer; text-align: center; }
    .chip-btn:active { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; }
    
    /* Merkez Anons Bildirim Afişi */
    .notice-banner { background: #fef7e0; border: 2px solid #f9ab00; border-radius: 10px; padding: 12px; margin-bottom: 14px; display: none; animation: pulseBanner 1s infinite alternate; }
    @keyframes pulseBanner { from { box-shadow: 0 0 4px rgba(249, 171, 0, 0.4); } to { box-shadow: 0 0 14px rgba(249, 171, 0, 0.9); } }
    .notice-banner h3 { font-size: 14px; color: #b06000; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .notice-banner p { font-size: 13px; color: #202124; font-weight: bold; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Personel Mobil Konum</h1>
    <div id="conn-badge" class="status-badge offline">Sunucuya Bağlanıyor...</div>

    <!-- Merkez Anons Afişi -->
    <div id="notice-banner" class="notice-banner">
      <h3>📢 Merkez Yönetim Mesajı:</h3>
      <p id="notice-text">Lütfen merkezi arayın.</p>
    </div>

    <label for="user-id">Personel Adı / Kod:</label>
    <input type="text" id="user-id" value="Saha_Personeli_1" placeholder="Örn: Ahmet_Kaya">

    <button id="btn-toggle-tracking" class="btn-success" onclick="toggleTracking()">
      ▶ Gerçek GPS Takibini Başlat
    </button>

    <button class="btn-outline" onclick="sendSimulatedLocation()">
      📍 Test Konumu Gönder (Simülasyon)
    </button>

    <!-- Hızlı Durum / Telsiz Bildirimi -->
    <div class="status-chips-title">💬 Hızlı Durum / Telsiz Bildirimi:</div>
    <div class="status-chips">
      <button type="button" class="chip-btn" onclick="sendStatus('🚦 Trafikteyim')">🚦 Trafikteyim</button>
      <button type="button" class="chip-btn" onclick="sendStatus('🍽️ Mola / Yemek')">🍽️ Mola / Yemek</button>
      <button type="button" class="chip-btn" onclick="sendStatus('✅ Görev Bitti')">✅ Görev Bitti</button>
      <button type="button" class="chip-btn" onclick="sendStatus('🏢 Merkeze Dönüyorum')">🏢 Merkeze Dönüş</button>
    </div>

    <!-- SOS Panik Butonu -->
    <button class="btn-sos" onclick="triggerSos()">
      🚨 SOS / ACİL DURUM BİLDİR
    </button>

    <div class="info-box" style="margin-top: 14px;">
      <div><strong>Pil Koruma:</strong> <span id="battery-mode" class="mode-pill idle">🔋 Akıllı Mod Aktif</span></div>
      <div><strong>Son İletilen:</strong> <span id="last-coords">Henüz gönderilmedi</span></div>
      <div><strong>Hız:</strong> <span id="current-speed">0 km/s</span></div>
      <div><strong>Saat:</strong> <span id="last-time">-</span></div>
      <div><strong>Durum:</strong> <span id="status-msg">Hazır</span></div>
    </div>

    <div style="text-align: center; margin-top: 14px;">
      <a href="/" style="font-size: 13px; color: #1a73e8; text-decoration: none; font-weight: bold;">
        🖥️ Yönetici (Admin) Paneline Geçiş Yap &rarr;
      </a>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const connBadge = document.getElementById('conn-badge');
    const userIdInput = document.getElementById('user-id');
    const lastCoordsSpan = document.getElementById('last-coords');
    const lastTimeSpan = document.getElementById('last-time');
    const statusMsgSpan = document.getElementById('status-msg');
    const currentSpeedSpan = document.getElementById('current-speed');
    const batteryModeSpan = document.getElementById('battery-mode');
    const btnToggle = document.getElementById('btn-toggle-tracking');

    let watchId = null;
    let lastSentLat = null;
    let lastSentLon = null;
    let lastSentTime = 0;
    let currentBattery = 95;

    // Pil seviyesini tarayıcıdan öğren (Battery API)
    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        currentBattery = Math.round(b.level * 100);
        b.addEventListener('levelchange', () => { currentBattery = Math.round(b.level * 100); });
      }).catch(() => {});
    }

    // Haversine Metre Hesabı
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    socket.on('connect', () => {
      connBadge.textContent = '● Merkeze Bağlı';
      connBadge.className = 'status-badge online';
      statusMsgSpan.textContent = 'Merkezle bağlantı kuruldu.';
    });

    socket.on('disconnect', () => {
      connBadge.textContent = '○ Bağlantı Kesildi';
      connBadge.className = 'status-badge offline';
      statusMsgSpan.textContent = 'Bağlantı koptu, yeniden deneniyor...';
    });

    // Konum Gönderme (Akıllı Pil Tasarrufu ile)
    function sendLocation(lat, lon, speed = 0, force = false) {
      const now = Date.now();
      const speedKm = Math.round(speed || 0);

      // Akıllı Tasarruf Kontrolü:
      if (!force && lastSentLat !== null && lastSentLon !== null) {
        const dist = getDistanceMeters(lastSentLat, lastSentLon, lat, lon);
        const timeDiffSec = (now - lastSentTime) / 1000;

        // Personel duruyorsa (Mesafe < 15 metre ve Hız < 3 km/s)
        if (dist < 15 && speedKm < 3) {
          batteryModeSpan.textContent = '🔋 Duraklamada (Pil Tasarrufu: 45sn)';
          batteryModeSpan.className = 'mode-pill idle';
          // 45 saniye geçmediyse göndermeyi atla
          if (timeDiffSec < 45) {
            statusMsgSpan.textContent = `Hareketsiz mola (Sonraki: ${Math.round(45 - timeDiffSec)}sn)`;
            return;
          }
        } else {
          // Hareket halinde
          batteryModeSpan.textContent = '🚗 Hareket Halinde (Canlı: 4sn)';
          batteryModeSpan.className = 'mode-pill moving';
          if (timeDiffSec < 4) return; // 4 saniyeden sık atıp pili harcama
        }
      }

      lastSentLat = lat;
      lastSentLon = lon;
      lastSentTime = now;

      const userId = userIdInput.value.trim() || 'Saha_Personeli';
      const timeStr = new Date().toLocaleTimeString();
      const payload = {
        userId: userId,
        latitude: lat,
        longitude: lon,
        speed: speedKm,
        battery: currentBattery,
        timestamp: new Date().toISOString()
      };

      if (socket && socket.connected) {
        socket.emit('updateLocation', payload);
      }

      fetch('/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: userId, lat: lat, lon: lon, speed: speedKm, battery: currentBattery })
      })
      .then(r => r.json())
      .then((data) => {
        if (data.status === 'OFF_SHIFT') {
          connBadge.textContent = '⏰ Mesai Dışı';
          connBadge.className = 'status-badge offline';
          statusMsgSpan.textContent = data.message || 'Mesai dışı takip durduruldu.';
        } else {
          lastCoordsSpan.textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
          lastTimeSpan.textContent = timeStr;
          currentSpeedSpan.textContent = `${speedKm} km/s`;
          statusMsgSpan.textContent = 'Konum merkeze iletildi.';
        }
      })
      .catch((e) => {
        statusMsgSpan.textContent = 'Gönderim hatası: ' + e.message;
      });
    }

    // SOS / Panik Butonu (Garantili Çift Kanallı İletim)
    function triggerSos() {
      const userId = userIdInput.value.trim() || 'Saha_Personeli_1';
      if (!confirm(`🚨 DİKKAT!\n\nMerkeze ve yöneticilere ACİL DURUM (SOS) çağrısı gönderilsin mi?`)) {
        return;
      }

      function doSendSos(lat, lon, speed) {
        const payload = {
          userId: userId,
          latitude: lat,
          longitude: lon,
          speed: speed || 0,
          battery: currentBattery,
          timestamp: new Date().toISOString()
        };

        if (socket && socket.connected) {
          socket.emit('sosAlert', payload);
        }

        fetch('/sos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(() => {
          alert(`🚨 ACİL DURUM BİLDİRİLDİ!\n\nKonumunuz (${lat.toFixed(5)}, ${lon.toFixed(5)}) siren ile yönetici ekranına iletildi.`);
          statusMsgSpan.textContent = '🚨 SOS ÇAĞRISI AKTİF!';
        }).catch(e => {
          alert('SOS iletim hatası: ' + e.message);
        });
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          doSendSos(pos.coords.latitude, pos.coords.longitude, Math.round((pos.coords.speed || 0) * 3.6));
        },
        () => {
          const lat = lastSentLat || 41.04239;
          const lon = lastSentLon || 28.68986;
          doSendSos(lat, lon, 0);
        },
        { enableHighAccuracy: true, timeout: 3500 }
      );
    }

    // Gerçek GPS Takibi
    function toggleTracking() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btnToggle.textContent = '▶ Gerçek GPS Takibini Başlat';
        btnToggle.className = 'btn-success';
        statusMsgSpan.textContent = 'GPS takibi durduruldu.';
        return;
      }

      if (!('geolocation' in navigator)) {
        alert('Cihazınızda GPS desteği bulunmuyor.');
        return;
      }

      btnToggle.textContent = '⏸ Takibi Durdur';
      btnToggle.className = 'btn-danger';
      statusMsgSpan.textContent = 'GPS uyduları aranıyor...';

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const speedKm = Math.round((pos.coords.speed || 0) * 3.6);
          sendLocation(lat, lon, speedKm);
        },
        (err) => {
          statusMsgSpan.textContent = 'GPS Hatası: ' + err.message;
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // Test Konumu
    let simLat = 41.04239;
    let simLon = 28.68986;
    function sendSimulatedLocation() {
      simLat += (Math.random() - 0.45) * 0.002;
      simLon += (Math.random() - 0.45) * 0.002;
      const simSpeed = Math.floor(Math.random() * 45);
      sendLocation(simLat, simLon, simSpeed, true);
    }

    // Telsiz / Hızlı Durum Bildirimi Gönder
    function sendStatus(statusText) {
      const userId = userIdInput.value.trim() || 'Saha_Personeli_1';
      statusMsgSpan.textContent = `Durum bildirildi: ${statusText}`;

      if (socket && socket.connected) {
        socket.emit('fieldStatus', { userId, statusText, timestamp: new Date().toISOString() });
      }

      fetch('/api/status-update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, statusText })
      }).catch(() => {});
    }

    // Merkezden Gelen Anonsları Dinle
    socket.on('adminNotice', (data) => {
      const myId = userIdInput.value.trim();
      if (!data || (data.target !== 'ALL' && data.target !== myId)) return;

      const banner = document.getElementById('notice-banner');
      const text = document.getElementById('notice-text');
      text.textContent = data.text;
      banner.style.display = 'block';

      // Titreşim ve Bip Sesi
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 750;
        osc.start();
        setTimeout(() => osc.stop(), 300);
      } catch (e) {}
    });

    // PWA Service Worker Kaydı
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
